<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星蚀觉醒：Flora 行动</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        
        body { 
            font-family: 'Courier New', 'Noto Sans SC', monospace; 
            margin: 0; 
            overflow: hidden; 
            background-color: #0a0a0f;
        }

        /* 🌌 星空背景与高清图库 */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=1920&auto=format&fit=crop') center/cover;
        }
        
        /* 底层星空画布 */
        #starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        /* 扫描线特效 */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; z-index: 20; pointer-events: none;
        }

        /* 画面震动特效 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active { animation: shake 0.5s; animation-iteration-count: infinite; }

        /* 打字机闪烁游标 */
        .cursor::after {
            content: '█'; animation: blink 1s infinite; color: #fff;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 选项按钮特效 */
        .choice-btn { transition: all 0.3s ease; }
        .choice-btn:hover { transform: scale(1.02); }
        .btn-good:hover { background-color: #2ecc71; color: black; box-shadow: 0 0 20px #2ecc71; border-color: #2ecc71; }
        .btn-bad:hover { background-color: #e74c3c; color: black; box-shadow: 0 0 20px #e74c3c; border-color: #e74c3c; }

        #visual-bg { transition: background 1.5s ease; background-size: cover; background-position: center; }
    </style>
</head>
<body class="text-gray-200 h-screen w-screen flex flex-col items-center justify-center relative">

    <div id="bg-image"></div>
    <canvas id="starfield"></canvas>
    
    <canvas id="trailfield" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none;"></canvas>

    <a href="index.html" class="absolute top-4 left-4 z-50 text-gray-400 hover:text-white transition duration-300 backdrop-blur-md bg-black/30 px-4 py-2 rounded-full border border-white/10">
        <i class="fas fa-arrow-left mr-2"></i>返回秘密节点
    </a>

    <div id="start-overlay" class="absolute inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-opacity duration-1000">
        <i class="fas fa-satellite-dish text-6xl text-purple-500 mb-6 animate-pulse drop-shadow-[0_0_15px_rgba(168,85,247,0.8)]"></i>
        <button onclick="startVisualNovel()" class="px-8 py-4 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xl rounded-md tracking-widest shadow-[0_0_20px_rgba(147,51,234,0.6)] transition-all transform hover:scale-105 border border-purple-400">
            建立神经连结 [START]
        </button>
    </div>

    <div id="vn-container" class="w-full max-w-5xl h-[80vh] border border-gray-600/50 bg-gray-900/85 backdrop-blur-md relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.9)] rounded-xl flex flex-col opacity-0 z-10">
        <div class="scanlines"></div>

        <div class="h-14 bg-black/60 border-b border-gray-700/50 flex items-center justify-between px-8 z-30">
            <div class="text-sm font-bold text-gray-400 transition-all" id="tl-1"><i class="fas fa-circle text-xs mr-2"></i>1. 星蚀降临</div>
            <div class="w-10 h-px bg-gray-700"></div>
            <div class="text-sm font-bold text-gray-600 transition-all" id="tl-2"><i class="fas fa-circle text-xs mr-2"></i>2. 黑暗火种</div>
            <div class="w-10 h-px bg-gray-700"></div>
            <div class="text-sm font-bold text-gray-600 transition-all" id="tl-3"><i class="fas fa-circle text-xs mr-2"></i>3. 命运汇聚</div>
            <div class="w-10 h-px bg-gray-700"></div>
            <div class="text-sm font-bold text-gray-600 transition-all" id="tl-4"><i class="fas fa-circle text-xs mr-2"></i>4. 终极抉择</div>
        </div>

        <div id="visual-bg" class="flex-1 relative flex items-end justify-center pb-4">
            <div id="character-stage" class="absolute bottom-10 left-10 right-10 flex justify-center gap-6 z-10"></div>
        </div>

        <div class="h-[35%] bg-black/80 border-t border-gray-700/80 p-8 z-30 relative backdrop-blur-lg">
            <div id="speaker-name" class="absolute -top-5 left-8 bg-purple-700 px-5 py-1.5 text-sm font-bold rounded shadow-[0_0_15px_rgba(147,51,234,0.6)] border border-purple-400 hidden">
                系统记录
            </div>
            
            <div id="dialogue-text" class="text-lg leading-relaxed text-gray-200 tracking-wide mt-2"></div>
            
            <div id="choices-container" class="hidden grid-cols-2 gap-6 mt-6">
                <button onclick="makeChoice('good')" class="choice-btn btn-good border border-gray-500 bg-gray-800/80 text-white px-6 py-4 rounded-lg font-bold text-left backdrop-blur-md">
                    <i class="fas fa-broadcast-tower mr-3 text-green-400"></i>授权全功率广播 (追求共生)
                </button>
                <button onclick="makeChoice('bad')" class="choice-btn btn-bad border border-gray-500 bg-gray-800/80 text-white px-6 py-4 rounded-lg font-bold text-left backdrop-blur-md">
                    <i class="fas fa-power-off mr-3 text-red-400"></i>终止程序并销毁数据 (明哲保身)
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🌌 ★ 全新双层画布脚本：背景星空 + 前景流星 ★
        function initInteractiveStarfield() {
            // 背景画布 (仅用于星星)
            const bgCanvas = document.getElementById('starfield');
            const bgCtx = bgCanvas.getContext('2d');
            
            // 顶层画布 (仅用于流星轨迹和火花)
            const trailCanvas = document.getElementById('trailfield');
            const trailCtx = trailCanvas.getContext('2d');

            let stars = [];
            let numStars = 1500; 
            
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetMouseX = mouseX;
            let targetMouseY = mouseY;

            let mouseTrail = [];
            const maxTrailLength = 25;
            let sparks = [];

            window.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX;
                targetMouseY = e.clientY;
            });

            function resize() {
                bgCanvas.width = window.innerWidth;
                bgCanvas.height = window.innerHeight;
                trailCanvas.width = window.innerWidth;
                trailCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 生成星空数据
            for (let i = 0; i < numStars; i++) {
                let isForeground = Math.random() > 0.9; 
                let radius = isForeground ? Math.random() * 1.5 + 0.5 : Math.random() * 0.8 + 0.2;
                let alphaBase = isForeground ? 0.6 : 0.1;
                let color = Math.random() > 0.1 ? 
                           `rgba(${220 + Math.random()*35}, ${220 + Math.random()*35}, ${220 + Math.random()*35}, ${alphaBase + Math.random()*0.3})` : 
                           `rgba(155, 89, 182, ${alphaBase + Math.random()*0.4})`;

                stars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: radius,
                    velocity: Math.random() * 0.1 + 0.03, 
                    parallax: Math.random() * 0.04 + 0.005, 
                    color: color
                });
            }

            function animate() {
                // 清理并渲染底层画布 (背景星星)
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                bgCtx.fillStyle = 'rgba(10, 10, 15, 0.7)'; 
                bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

                // 清理顶层画布 (流星与火花) -> 必须完全透明！
                trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

                let dx = targetMouseX - mouseX;
                let dy = targetMouseY - mouseY;
                
                mouseX += dx * 0.2;
                mouseY += dy * 0.2;

                mouseTrail.unshift({x: mouseX, y: mouseY});
                if (mouseTrail.length > maxTrailLength) mouseTrail.pop();

                let offsetX = mouseX - bgCanvas.width / 2;
                let offsetY = mouseY - bgCanvas.height / 2;

                // --- 1. 绘制背景星星 (在 bgCtx 上) ---
                stars.forEach(star => {
                    star.y += star.velocity; 

                    let starDx = targetMouseX - star.x;
                    let starDy = targetMouseY - star.y;
                    let distance = Math.sqrt(starDx * starDx + starDy * starDy);
                    
                    if (distance < 100) { 
                        let force = (100 - distance) / 100;
                        star.x -= (starDx / distance) * force * 1.5;
                        star.y -= (starDy / distance) * force * 1.5;
                    }

                    if (star.y > bgCanvas.height) {
                        star.y = -10;
                        star.x = Math.random() * bgCanvas.width;
                    }
                    if (star.x > bgCanvas.width) star.x = 0;
                    if (star.x < 0) star.x = bgCanvas.width;

                    let drawX = star.x - offsetX * star.parallax;
                    let drawY = star.y - offsetY * star.parallax;

                    bgCtx.beginPath();
                    bgCtx.arc(drawX, drawY, star.radius, 0, Math.PI * 2);
                    bgCtx.fillStyle = star.color;
                    bgCtx.fill();
                });

                // --- 2. 绘制流星轨迹 (在 trailCtx 上，绝对前置) ---
                trailCtx.lineCap = 'round';
                trailCtx.lineJoin = 'round';
                
                for (let i = 0; i < mouseTrail.length - 1; i++) {
                    let point = mouseTrail[i];
                    let nextPoint = mouseTrail[i+1];
                    
                    let dist = Math.abs(point.x - nextPoint.x) + Math.abs(point.y - nextPoint.y);
                    if (dist < 0.1) continue; 

                    let life = 1 - (i / mouseTrail.length); 
                    
                    trailCtx.beginPath();
                    trailCtx.moveTo(point.x, point.y);
                    trailCtx.lineTo(nextPoint.x, nextPoint.y);
                    
                    trailCtx.lineWidth = life * 15; 
                    trailCtx.strokeStyle = `rgba(168, 85, 247, ${life * 0.15})`; 
                    trailCtx.stroke();

                    trailCtx.lineWidth = life * 8; 
                    trailCtx.strokeStyle = `rgba(168, 85, 247, ${life * 0.4})`; 
                    trailCtx.stroke();

                    trailCtx.lineWidth = life * 3; 
                    trailCtx.strokeStyle = `rgba(255, 255, 255, ${life})`; 
                    trailCtx.stroke();
                }

                // --- 3. 流星能量火花 (在 trailCtx 上，绝对前置) ---
                let speed = Math.sqrt(dx*dx + dy*dy); 
                if (speed > 3 && Math.random() < 0.6) {
                    sparks.push({
                        x: mouseX + (Math.random()-0.5)*10,
                        y: mouseY + (Math.random()-0.5)*10,
                        vx: -dx * 0.05 + (Math.random()-0.5)*2, 
                        vy: -dy * 0.05 + (Math.random()-0.5)*2,
                        life: 1,
                        color: Math.random() > 0.5 ? 'rgba(168, 85, 247, 1)' : 'rgba(52, 152, 219, 1)' 
                    });
                }

                for (let i = sparks.length - 1; i >= 0; i--) {
                    let p = sparks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03; 

                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                    } else {
                        trailCtx.beginPath();
                        trailCtx.arc(p.x, p.y, p.life * 2.5, 0, Math.PI * 2);
                        trailCtx.fillStyle = p.color;
                        trailCtx.globalAlpha = p.life;
                        trailCtx.fill();
                        trailCtx.globalAlpha = 1;
                    }
                }

                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- 视觉小说逻辑 ---
        
        const chars = {
            system: { name: '系统记录', color: 'bg-gray-600 border-gray-400' },
            jax: { name: 'Jax (盲人拾荒者)', icon: 'fa-eye-slash', color: 'text-yellow-400', border: 'border-yellow-500' },
            elara: { name: 'Elara (数据编织者)', icon: 'fa-network-wired', color: 'text-green-400', border: 'border-green-500' },
            mike: { name: 'Mike (医疗学者)', icon: 'fa-flask', color: 'text-blue-400', border: 'border-blue-500' },
            kevin: { name: 'Kevin (补给站志工)', icon: 'fa-hand-holding-heart', color: 'text-red-400', border: 'border-red-500' },
            warning: { name: '系统警告', color: 'bg-red-700 border-red-400' }
        };

        const storyNodes = [
            {
                bg: 'radial-gradient(circle at center, rgba(155,89,182,0.3) 0%, transparent 80%)',
                step: 1,
                speaker: chars.system,
                text: '世界的崩溃已成定局。天际被紫黑色的「星蚀」笼罩，致命的结晶病在地表蔓延；而在深渊般的废铁城，统治阶级在云舟上宣扬着「金属永恒，血肉短暂」的谎言...',
                characters: []
            },
            {
                bg: 'radial-gradient(circle at center, rgba(46,204,113,0.3) 0%, transparent 80%)',
                step: 2,
                speaker: chars.system,
                text: '但在最深的黑暗中，真相的火种被点燃。Jax 在废铁城底层采到了远古母树的琥珀树液。同时，Elara 冒死解密了「Flora」档案，看见了曾被绿意覆盖的地球。',
                characters: [chars.jax, chars.elara] 
            },
            {
                bg: 'radial-gradient(circle at center, rgba(52,152,219,0.3) 0%, transparent 80%)',
                step: 3,
                speaker: chars.system,
                text: '在地表，Mike 在巴别塔深处推演出了让人类与晶石共存的「稳定剂配方」。而 Kevin 在紧急物资站中，用同理心维系着难民最后的人性，为反抗军争取了集结时间。',
                characters: [chars.mike, chars.kevin]
            },
            {
                bg: 'radial-gradient(circle at center, rgba(231,76,60,0.4) 0%, transparent 90%)',
                step: 4,
                speaker: chars.warning,
                text: '【警报：铁卫队正在破门！巴别塔净化程序即将启动！】\n\n协调员，四人的命运已在你手中。我们必须同步广播所有数据。抉择的时刻到了：',
                characters: [],
                shake: true, 
                showChoices: true
            }
        ];

        let currentNode = 0;
        let typeInterval;

        window.onload = () => {
            initInteractiveStarfield();
        };

        function startVisualNovel() {
            gsap.to("#start-overlay", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById("start-overlay").style.display = "none";
                gsap.to("#vn-container", { opacity: 1, duration: 1 });
                playNode(0);
            }});
        }

        function playNode(index) {
            if(index >= storyNodes.length) return;
            currentNode = index;
            const node = storyNodes[index];

            document.getElementById('visual-bg').style.background = node.bg;
            document.getElementById('visual-bg').style.backgroundSize = 'cover';
            document.getElementById('visual-bg').style.backgroundPosition = 'center';

            for(let i=1; i<=4; i++) {
                let el = document.getElementById(`tl-${i}`);
                if(i < node.step) el.className = "text-sm font-bold text-gray-500 transition-all";
                else if(i === node.step) el.className = "text-sm font-bold text-purple-400 drop-shadow-[0_0_10px_rgba(168,85,247,0.9)] scale-110 transition-all";
                else el.className = "text-sm font-bold text-gray-600 transition-all";
            }

            const stage = document.getElementById('character-stage');
            stage.innerHTML = ''; 
            node.characters.forEach((c, idx) => {
                let card = document.createElement('div');
                card.className = `bg-gray-900/90 backdrop-blur-md border ${c.border} p-4 rounded-xl flex flex-col items-center justify-center w-48 shadow-[0_0_20px_rgba(0,0,0,0.5)] transform translate-y-20 opacity-0`;
                card.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-gray-800 flex items-center justify-center mb-3 border-2 ${c.border} shadow-[0_0_15px_currentColor] ${c.color}">
                        <i class="fas ${c.icon} text-3xl"></i>
                    </div>
                    <div class="text-sm font-bold text-white text-center">${c.name}</div>
                `;
                stage.appendChild(card);
                gsap.to(card, { y: 0, opacity: 1, duration: 0.8, delay: idx * 0.3, ease: "back.out(1.5)" });
            });

            const speakerBox = document.getElementById('speaker-name');
            speakerBox.style.display = 'block';
            speakerBox.className = `absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded shadow-[0_0_15px_rgba(0,0,0,0.5)] border ${node.speaker.color}`;
            speakerBox.innerText = node.speaker.name;

            if(node.shake) document.getElementById('vn-container').classList.add('shake-active');
            else document.getElementById('vn-container').classList.remove('shake-active');

            const textContainer = document.getElementById('dialogue-text');
            textContainer.innerHTML = '';
            textContainer.classList.add('cursor');
            clearInterval(typeInterval);
            
            let charIndex = 0;
            typeInterval = setInterval(() => {
                if(charIndex < node.text.length) {
                    textContainer.innerHTML = node.text.substring(0, charIndex + 1).replace(/\n/g, '<br>');
                    charIndex++;
                } else {
                    clearInterval(typeInterval);
                    textContainer.classList.remove('cursor');
                    
                    if(node.showChoices) {
                        document.getElementById('choices-container').classList.remove('hidden');
                        document.getElementById('choices-container').classList.add('grid');
                        gsap.from(".choice-btn", { y: 20, opacity: 0, duration: 0.5, stagger: 0.2 });
                    } else {
                        setTimeout(() => playNode(currentNode + 1), 6000);
                    }
                }
            }, 45); 
        }

        function makeChoice(type) {
            document.getElementById('choices-container').classList.add('hidden');
            document.getElementById('vn-container').classList.remove('shake-active');
            document.getElementById('character-stage').innerHTML = ''; 
            
            const textContainer = document.getElementById('dialogue-text');
            const speakerBox = document.getElementById('speaker-name');
            
            if (type === 'good') {
                document.getElementById('visual-bg').style.background = "radial-gradient(circle at center, rgba(46,204,113,0.5) 0%, transparent 90%)";
                speakerBox.className = "absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded bg-green-700 border border-green-400 shadow-[0_0_15px_rgba(46,204,113,0.8)]";
                speakerBox.innerText = "结局达成";
                typeWriter(textContainer, "【好结局：星蚀觉醒】\n\n广播成功！Mike 燃烧晶骨能量启动了巴别塔，Elara 将数字种子插入了覆写埠。废铁城的屏幕绽放出翠绿森林，地表的紫光褪去，取而代之的是共存的蓝光。一个金属、血肉与晶石共存的新纪元破晓了。");
                document.getElementById('vn-container').style.boxShadow = "0 0 50px rgba(46, 204, 113, 0.4)";
            } else {
                document.getElementById('visual-bg').style.background = "radial-gradient(circle at center, rgba(231,76,60,0.5) 0%, transparent 90%)";
                speakerBox.className = "absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded bg-red-800 border border-red-500 shadow-[0_0_15px_rgba(231,76,60,0.8)]";
                speakerBox.innerText = "任务失败";
                typeWriter(textContainer, "【坏结局：永恒之锈】\n\n你选择了退缩。铁卫队击毁了终端机，Mike 最终力竭倒下。Elara 被捕，Jax 的树液被熔毁。废铁城的齿轮无情运转，谎言继续维持着虚假的秩序，这世界再次被遗忘在金属的摩擦声中。");
                document.getElementById('vn-container').style.boxShadow = "0 0 50px rgba(231, 76, 60, 0.4)";
            }
        }

        function typeWriter(element, text) {
            element.innerHTML = '';
            element.classList.add('cursor');
            let i = 0;
            let interval = setInterval(() => {
                if(i < text.length) {
                    element.innerHTML = text.substring(0, i + 1).replace(/\n/g, '<br>');
                    i++;
                } else {
                    clearInterval(interval);
                    element.classList.remove('cursor');
                }
            }, 45);
        }
    </script>
</body>
</html>
