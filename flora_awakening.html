<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星核尘界：平行穿越录 - 终极决战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        
        body { 
            font-family: 'Courier New', 'Noto Sans SC', monospace; 
            margin: 0; 
            overflow: hidden; 
            background-color: #0a0a0f;
        }

        /* 统一使用本地背景图 pic1 */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: url('character/pic1.png') center/cover;
        }
        
        #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; z-index: 20; pointer-events: none;
        }

        @keyframes shake {
            0%, 100% { transform: translate(1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
        }
        .shake-active { animation: shake 0.5s infinite; }

        .cursor::after { content: '█'; animation: blink 1s infinite; color: #fff; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .choice-btn { transition: all 0.3s ease; }
        .choice-btn:hover { transform: scale(1.02); }
        .btn-good:hover { background-color: #2ecc71; color: black; box-shadow: 0 0 20px #2ecc71; border-color: #2ecc71; }
        .btn-bad:hover { background-color: #e74c3c; color: black; box-shadow: 0 0 20px #e74c3c; border-color: #e74c3c; }

        #visual-bg { transition: background 1.5s ease; background-size: cover; background-position: center; }
    </style>
</head>
<body class="text-gray-200 h-screen w-screen flex flex-col items-center justify-center relative">

    <div id="bg-image"></div>
    <canvas id="starfield"></canvas>
    <canvas id="trailfield" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none;"></canvas>

    <a href="index.html" class="absolute top-4 left-4 z-50 text-gray-400 hover:text-white transition duration-300 backdrop-blur-md bg-black/30 px-4 py-2 rounded-full border border-white/10">
        <i class="fas fa-arrow-left mr-2"></i>返回星核中枢
    </a>

    <div id="start-overlay" class="absolute inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-opacity duration-1000">
        <i class="fas fa-dungeon text-6xl text-purple-500 mb-6 animate-pulse drop-shadow-[0_0_15px_rgba(168,85,247,0.8)]"></i>
        <button onclick="startVisualNovel()" class="px-8 py-4 bg-purple-700 hover:bg-purple-600 text-white font-bold text-xl rounded-md tracking-widest shadow-[0_0_20px_rgba(147,51,234,0.6)] transition-all transform hover:scale-105 border border-purple-400">
            跨越星门 [START]
        </button>
    </div>

    <div id="vn-container" class="w-full max-w-5xl h-[80vh] border border-gray-600/50 bg-gray-900/85 backdrop-blur-md relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.9)] rounded-xl flex flex-col opacity-0 z-10">
        <div class="scanlines"></div>

        <div class="h-14 bg-black/60 border-b border-gray-700/50 flex items-center justify-between px-6 z-30 overflow-x-auto whitespace-nowrap">
            <div class="text-xs font-bold text-gray-400 transition-all" id="tl-1"><i class="fas fa-circle text-[10px] mr-1"></i>1. 星蚀前传</div>
            <div class="w-4 md:w-8 h-px bg-gray-700 mx-2"></div>
            <div class="text-xs font-bold text-gray-600 transition-all" id="tl-2"><i class="fas fa-circle text-[10px] mr-1"></i>2. 废土星门</div>
            <div class="w-4 md:w-8 h-px bg-gray-700 mx-2"></div>
            <div class="text-xs font-bold text-gray-600 transition-all" id="tl-3"><i class="fas fa-circle text-[10px] mr-1"></i>3. 绿境结盟</div>
            <div class="w-4 md:w-8 h-px bg-gray-700 mx-2"></div>
            <div class="text-xs font-bold text-gray-600 transition-all" id="tl-4"><i class="fas fa-circle text-[10px] mr-1"></i>4. 暗晶突袭</div>
            <div class="w-4 md:w-8 h-px bg-gray-700 mx-2"></div>
            <div class="text-xs font-bold text-gray-600 transition-all" id="tl-5"><i class="fas fa-circle text-[10px] mr-1"></i>5. 终极决战</div>
        </div>

        <div id="visual-bg" class="flex-1 relative flex items-end justify-center pb-4">
            <div id="character-stage" class="absolute bottom-10 left-4 right-4 flex justify-center gap-2 md:gap-6 z-10 flex-wrap"></div>
        </div>

        <div class="h-[35%] bg-black/80 border-t border-gray-700/80 p-8 z-30 relative backdrop-blur-lg">
            <div id="speaker-name" class="absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded shadow-[0_0_15px_rgba(147,51,234,0.6)] border hidden"></div>
            <div id="dialogue-text" class="text-base md:text-lg leading-relaxed text-gray-200 tracking-wide mt-2"></div>
            
            <div id="choices-container" class="hidden grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mt-6">
                <button onclick="makeChoice('good')" class="choice-btn btn-good border border-gray-500 bg-gray-800/80 text-white px-4 md:px-6 py-3 md:py-4 rounded-lg font-bold text-sm md:text-base text-left backdrop-blur-md">
                    <i class="fas fa-shield-alt mr-3 text-green-400"></i>启动绿晶净化阵列 (结成共生盟约)
                </button>
                <button onclick="makeChoice('bad')" class="choice-btn btn-bad border border-gray-500 bg-gray-800/80 text-white px-4 md:px-6 py-3 md:py-4 rounded-lg font-bold text-sm md:text-base text-left backdrop-blur-md">
                    <i class="fas fa-bomb mr-3 text-red-400"></i>摧毁星门切断连接 (保护尘界孤岛)
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🌌 ★ 完美无 Bug 双层画布：包含流星轨迹与精准排斥力 ★
        function initInteractiveStarfield() {
            const bgCanvas = document.getElementById('starfield');
            const bgCtx = bgCanvas.getContext('2d');
            const trailCanvas = document.getElementById('trailfield');
            const trailCtx = trailCanvas.getContext('2d');

            let stars = [];
            let numStars = 1500; 
            
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetMouseX = mouseX;
            let targetMouseY = mouseY;

            let mouseTrail = [];
            const maxTrailLength = 25;
            let sparks = [];

            window.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX;
                targetMouseY = e.clientY;
            });

            function resize() {
                bgCanvas.width = window.innerWidth;
                bgCanvas.height = window.innerHeight;
                trailCanvas.width = window.innerWidth;
                trailCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < numStars; i++) {
                let isForeground = Math.random() > 0.9; 
                let radius = isForeground ? Math.random() * 1.5 + 0.5 : Math.random() * 0.8 + 0.2;
                let alphaBase = isForeground ? 0.6 : 0.1;
                let color = Math.random() > 0.1 ? 
                           `rgba(${220 + Math.random()*35}, ${220 + Math.random()*35}, ${220 + Math.random()*35}, ${alphaBase + Math.random()*0.3})` : 
                           `rgba(155, 89, 182, ${alphaBase + Math.random()*0.4})`;

                stars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: radius,
                    velocity: Math.random() * 0.1 + 0.03, 
                    parallax: Math.random() * 0.04 + 0.005, 
                    color: color
                });
            }

            function animate() {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                bgCtx.fillStyle = 'rgba(10, 10, 15, 0.7)'; // 压暗背景
                bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

                trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

                let dx = targetMouseX - mouseX;
                let dy = targetMouseY - mouseY;
                mouseX += dx * 0.2;
                mouseY += dy * 0.2;

                mouseTrail.unshift({x: mouseX, y: mouseY});
                if (mouseTrail.length > maxTrailLength) mouseTrail.pop();

                let offsetX = mouseX - bgCanvas.width / 2;
                let offsetY = mouseY - bgCanvas.height / 2;

                // 1. 绘制星星与斥力
                stars.forEach(star => {
                    star.y += star.velocity; 

                    let drawX = star.x - offsetX * star.parallax;
                    let drawY = star.y - offsetY * star.parallax;

                    let starDx = targetMouseX - drawX;
                    let starDy = targetMouseY - drawY;
                    let distance = Math.sqrt(starDx * starDx + starDy * starDy);
                    
                    if (distance < 100) { 
                        let force = (100 - distance) / 100;
                        star.x -= (starDx / distance) * force * 2;
                        star.y -= (starDy / distance) * force * 2;
                    }

                    if (star.y > bgCanvas.height) {
                        star.y = -10;
                        star.x = Math.random() * bgCanvas.width;
                    }
                    if (star.x > bgCanvas.width) star.x = 0;
                    if (star.x < 0) star.x = bgCanvas.width;

                    bgCtx.beginPath();
                    bgCtx.arc(drawX, drawY, star.radius, 0, Math.PI * 2);
                    bgCtx.fillStyle = star.color;
                    bgCtx.fill();
                });

                // 2. 绘制流星轨迹
                trailCtx.lineCap = 'round';
                trailCtx.lineJoin = 'round';
                
                for (let i = 0; i < mouseTrail.length - 1; i++) {
                    let point = mouseTrail[i];
                    let nextPoint = mouseTrail[i+1];
                    
                    let dist = Math.abs(point.x - nextPoint.x) + Math.abs(point.y - nextPoint.y);
                    if (dist < 0.1) continue; 

                    let life = 1 - (i / mouseTrail.length); 
                    
                    trailCtx.beginPath();
                    trailCtx.moveTo(point.x, point.y);
                    trailCtx.lineTo(nextPoint.x, nextPoint.y);
                    
                    trailCtx.lineWidth = life * 15; 
                    trailCtx.strokeStyle = `rgba(168, 85, 247, ${life * 0.15})`; 
                    trailCtx.stroke();

                    trailCtx.lineWidth = life * 8; 
                    trailCtx.strokeStyle = `rgba(168, 85, 247, ${life * 0.4})`; 
                    trailCtx.stroke();

                    trailCtx.lineWidth = life * 3; 
                    trailCtx.strokeStyle = `rgba(255, 255, 255, ${life})`; 
                    trailCtx.stroke();
                }

                // 3. 绘制火花
                let speed = Math.sqrt(dx*dx + dy*dy); 
                if (speed > 3 && Math.random() < 0.6) {
                    sparks.push({
                        x: mouseX + (Math.random()-0.5)*10,
                        y: mouseY + (Math.random()-0.5)*10,
                        vx: -dx * 0.05 + (Math.random()-0.5)*2, 
                        vy: -dy * 0.05 + (Math.random()-0.5)*2,
                        life: 1,
                        color: Math.random() > 0.5 ? 'rgba(168, 85, 247, 1)' : 'rgba(52, 152, 219, 1)' 
                    });
                }

                for (let i = sparks.length - 1; i >= 0; i--) {
                    let p = sparks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03; 

                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                    } else {
                        trailCtx.beginPath();
                        trailCtx.arc(p.x, p.y, p.life * 2.5, 0, Math.PI * 2);
                        trailCtx.fillStyle = p.color;
                        trailCtx.globalAlpha = p.life;
                        trailCtx.fill();
                        trailCtx.globalAlpha = 1;
                    }
                }

                requestAnimationFrame(animate);
            }
            animate();
        }

        // --- 📖 视觉小说：8大角色动态加载图库 ---
        // ★ 注意：这里直接读取了你在 character 文件夹里的 pic 图片！
        const chars = {
            system: { name: '系统记录', color: 'bg-gray-600 border-gray-400' },
            mike: { name: 'Mike', img: 'character/pic2.png', color: 'border-blue-500 shadow-blue-500' },
            ember: { name: 'Ember', img: 'character/pic3.png', color: 'border-orange-500 shadow-orange-500' },
            firefly: { name: 'Firefly', img: 'character/pic4.png', color: 'border-yellow-400 shadow-yellow-400' },
            ellie: { name: 'Ellie', img: 'character/pic5.png', color: 'border-pink-500 shadow-pink-500' },
            kevin: { name: 'Kevin', img: 'character/pic6.png', color: 'border-gray-400 shadow-gray-400' },
            elara: { name: 'Elara', img: 'character/pic7.png', color: 'border-green-500 shadow-green-500' },
            jax: { name: 'Jax', img: 'character/pic8.png', color: 'border-teal-500 shadow-teal-500' },
            dark: { name: 'Dark', img: 'character/pic9.png', color: 'border-purple-800 shadow-purple-800' },
            warning: { name: '系统警告', color: 'bg-red-700 border-red-400' }
        };

        const storyNodes = [
            {
                bg: 'radial-gradient(circle at center, rgba(52,152,219,0.3) 0%, transparent 80%)',
                step: 1,
                speaker: chars.system,
                text: '前世纪“星蚀”爆发，英雄 Mike 牺牲自我拯救了世界。如今，科学家利用本源晶石中交织的“时空经纬”，落成了第一座“星门”，多元宇宙的探索即将开始...',
                characters: [chars.mike]
            },
            {
                bg: 'radial-gradient(circle at center, rgba(230,126,34,0.3) 0%, transparent 80%)',
                step: 2,
                speaker: chars.system,
                text: '由 Ember、Firefly、Ellie 组成的星巡队首批穿越星门，抵达编号001“赤岩废土”。在这个因滥用晶石而毁灭的世界，他们救出了幸存者领袖 Kevin。',
                characters: [chars.ember, chars.firefly, chars.ellie, chars.kevin] 
            },
            {
                bg: 'radial-gradient(circle at center, rgba(46,204,113,0.3) 0%, transparent 80%)',
                step: 3,
                speaker: chars.system,
                text: '星门连接至002“绿境繁生”。在这个世界里，Elara 与 Jax 运用“数码种子”和“生命树脂”将冰冷的钢铁废墟化作了生机盎然的生命绿境，两界正式结成联盟。',
                characters: [chars.elara, chars.jax]
            },
            {
                bg: 'radial-gradient(circle at center, rgba(142,68,173,0.3) 0%, transparent 80%)',
                step: 4,
                speaker: chars.warning,
                text: '【警报：星门遭受暗晶攻击！】\n003“暗晶神域”因能源濒临枯竭走向掠夺。其首领 Dark 率领暗晶军团突袭星巡队营地，企图掠夺本源晶石，多界文明危在旦夕！',
                characters: [chars.dark],
                shake: true
            },
            {
                bg: 'radial-gradient(circle at center, rgba(231,76,60,0.4) 0%, transparent 90%)',
                step: 5,
                speaker: chars.ember,
                text: '“全队注意！Elara 和 Jax 带来了融合的‘绿晶’！”\n\n协调员，防御屏障即将崩溃，请立即下达最终指令，决定平行宇宙的命运：',
                characters: [chars.ember, chars.elara, chars.jax],
                shake: true, 
                showChoices: true
            }
        ];

        let currentNode = 0;
        let typeInterval;

        window.onload = () => { initInteractiveStarfield(); };

        function startVisualNovel() {
            gsap.to("#start-overlay", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById("start-overlay").style.display = "none";
                gsap.to("#vn-container", { opacity: 1, duration: 1 });
                playNode(0);
            }});
        }

        function playNode(index) {
            if(index >= storyNodes.length) return;
            currentNode = index;
            const node = storyNodes[index];

            document.getElementById('visual-bg').style.background = node.bg;

            for(let i=1; i<=5; i++) {
                let el = document.getElementById(`tl-${i}`);
                if(i < node.step) el.className = "text-xs font-bold text-gray-500 transition-all mx-1 md:mx-2";
                else if(i === node.step) el.className = "text-xs font-bold text-purple-400 drop-shadow-[0_0_10px_rgba(168,85,247,0.9)] scale-110 transition-all mx-1 md:mx-2";
                else el.className = "text-xs font-bold text-gray-600 transition-all mx-1 md:mx-2";
            }

            const stage = document.getElementById('character-stage');
            stage.innerHTML = ''; 
            
            // ★ 这里改写了渲染逻辑：直接读取角色的本地头像 img ★
            node.characters.forEach((c, idx) => {
                let card = document.createElement('div');
                // 让卡片变窄一点以容纳更多角色
                card.className = `bg-gray-900/90 backdrop-blur-md border-2 ${c.color} p-2 rounded-xl flex flex-col items-center justify-center w-24 md:w-32 shadow-[0_0_15px_rgba(0,0,0,0.5)] transform translate-y-20 opacity-0`;
                card.innerHTML = `
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gray-800 mb-2 border-2 ${c.color} overflow-hidden shadow-[0_0_10px_currentColor]">
                        <img src="${c.img}" alt="${c.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="text-[12px] md:text-sm font-bold text-white text-center">${c.name}</div>
                `;
                stage.appendChild(card);
                gsap.to(card, { y: 0, opacity: 1, duration: 0.8, delay: idx * 0.3, ease: "back.out(1.5)" });
            });

            const speakerBox = document.getElementById('speaker-name');
            speakerBox.style.display = 'block';
            speakerBox.className = `absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded shadow-[0_0_15px_rgba(0,0,0,0.5)] border ${node.speaker.color}`;
            speakerBox.innerText = node.speaker.name;

            if(node.shake) document.getElementById('vn-container').classList.add('shake-active');
            else document.getElementById('vn-container').classList.remove('shake-active');

            const textContainer = document.getElementById('dialogue-text');
            textContainer.innerHTML = '';
            textContainer.classList.add('cursor');
            clearInterval(typeInterval);
            
            let charIndex = 0;
            typeInterval = setInterval(() => {
                if(charIndex < node.text.length) {
                    textContainer.innerHTML = node.text.substring(0, charIndex + 1).replace(/\n/g, '<br>');
                    charIndex++;
                } else {
                    clearInterval(typeInterval);
                    textContainer.classList.remove('cursor');
                    
                    if(node.showChoices) {
                        document.getElementById('choices-container').classList.remove('hidden');
                        document.getElementById('choices-container').classList.add('grid');
                        gsap.from(".choice-btn", { y: 20, opacity: 0, duration: 0.5, stagger: 0.2 });
                    } else {
                        setTimeout(() => playNode(currentNode + 1), 6000); // 调整了阅读等待时间
                    }
                }
            }, 45); 
        }

        function makeChoice(type) {
            document.getElementById('choices-container').classList.add('hidden');
            document.getElementById('vn-container').classList.remove('shake-active');
            document.getElementById('character-stage').innerHTML = ''; 
            
            const textContainer = document.getElementById('dialogue-text');
            const speakerBox = document.getElementById('speaker-name');
            
            if (type === 'good') {
                document.getElementById('visual-bg').style.background = "radial-gradient(circle at center, rgba(46,204,113,0.5) 0%, transparent 90%)";
                speakerBox.className = "absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded bg-green-700 border border-green-400 shadow-[0_0_15px_rgba(46,204,113,0.8)]";
                speakerBox.innerText = "结局达成";
                typeWriter(textContainer, "【真结局：多元宇宙共生】\n\n你启动了绿晶阵列！生命树脂与本源晶石的光芒瞬间中和了暗晶的腐蚀。暗晶军团被感化，首领 Dark 宣布投降。战后，星核尘界帮助暗晶神域稳定了能源，三个平行世界签订了共生盟约。星门成为了多元宇宙交流的桥梁，文明迎来了真正的黎明！");
                document.getElementById('vn-container').style.boxShadow = "0 0 50px rgba(46, 204, 113, 0.4)";
            } else {
                document.getElementById('visual-bg').style.background = "radial-gradient(circle at center, rgba(231,76,60,0.5) 0%, transparent 90%)";
                speakerBox.className = "absolute -top-5 left-8 px-5 py-1.5 text-sm font-bold rounded bg-red-800 border border-red-500 shadow-[0_0_15px_rgba(231,76,60,0.8)]";
                speakerBox.innerText = "孤立结局";
                typeWriter(textContainer, "【坏结局：尘界的孤岛】\n\n你选择了炸毁星门切断连接！强烈的时空坍塌将暗晶军团永远挡在了门外，但也彻底摧毁了探索平行宇宙的希望。能源枯竭的阴影依然笼罩着星核尘界，文明在孤立无援中，慢慢步入不可逆转的衰亡深渊...");
                document.getElementById('vn-container').style.boxShadow = "0 0 50px rgba(231, 76, 60, 0.4)";
            }
        }

        function typeWriter(element, text) {
            element.innerHTML = '';
            element.classList.add('cursor');
            let i = 0;
            let interval = setInterval(() => {
                if(i < text.length) {
                    element.innerHTML = text.substring(0, i + 1).replace(/\n/g, '<br>');
                    i++;
                } else {
                    clearInterval(interval);
                    element.classList.remove('cursor');
                }
            }, 45);
        }
    </script>
</body>
</html>
